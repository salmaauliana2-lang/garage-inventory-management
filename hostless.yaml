# Konfigurasi deploy Hostless — lihat docs.hostless.cloud/app/hostlessfile
# Terbaca otomatis setiap push ke repository ini.
build:
  system: auto
  min_cpu: 0.1
  max_cpu: 1
  min_memory: 512
  max_memory: 2048

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 128
  max_memory: 512

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
